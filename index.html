<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Yoruba Alphabet App (yoruba alphabet)</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
         <div class="container">
            <!-- <div class="abidi"> -->
                <div class="abidi-app">
                     <h5>HisolTech</h5>
                      <h3>Yoruba  Alphabet App ( yoruba alphabet )</h3>
                    <div class="output">
                        <p id="result">View</p>
                    </div>
                    <div class="abidi-text">
                        <button class="btn-o" id="btn" onclick="displayApp0('')"></button>
                        <button id="btn" onclick="displayApp1('A')">A</button>
                        <button id="btn" onclick="displayApp2('B')">B</button>
                        <button id="btn" onclick="displayApp3('D')">D</button>

                        <button id="btn" onclick="displayApp5('Ẹ')">Ẹ</button>
                        <button id="btn" onclick="displayApp6('F')">F</button>

                        <button id="btn" onclick="displayApp10('I')">I</button>
                        <button id="btn" onclick="displayApp11('J')">J</button>
                        <button id="btn" onclick="displayApp12('K')">K</button>
                        <button id="btn" onclick="displayApp13('L')">L</button>
                        <button id="btn" onclick="displayApp14('M')">M</button>
                        <button id="btn" onclick="displayApp15('N')">N</button>
                        <button id="btn" onclick="displayApp16('O')">O</button>
                        <button id="btn" onclick="displayApp17('Ọ')">Ọ</button>

                        <button id="btn" onclick="displayApp19('R')">R</button>
                        <button id="btn" onclick="displayApp20('S')">S</button>
                        <button id="btn" onclick="displayApp21('Ṣ')">Ṣ</button>
                        <button id="btn" onclick="displayApp22('T')">T</button>
                        <button id="btn" onclick="displayApp23('U')">U</button>
                        <button id="btn" onclick="displayApp24('W')">W</button>
                        <button id="btn" onclick="displayApp25('Y')">Y</button>
                    </div>
                </div>
            <!-- </div> -->
        </div>  
        <script src="script.js"></script>
    </body>
</html>
